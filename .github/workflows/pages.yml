name: Deploy design site to GitHub Pages

# GitHub Pages must be enabled once in the repo UI
# (Settings > Pages > Source: "GitHub Actions"). Deploys on push once
# the repo is public and Pages is enabled.
on:
  push:
    branches: ["claude/mac-mail-app-handoff-g6crjh"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload design/ as site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./design
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
