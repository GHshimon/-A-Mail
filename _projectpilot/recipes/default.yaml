schemaVersion: 1
recipes:
  - id: s0-seed-brief
    version: 1
    stageId: S0
    title: Seed Briefを整える
    summary: 登録資料から企画の種を一枚にまとめます。
    status: active
    permission: draft
    runnerRole: planning-lead
    reviewerRoles:
      - critical-reviewer
      - user-advocate
    successCriteria:
      - 観測事実・提案・未確認を分離する
      - 既存成果物を上書きしない
      - 次の判断材料を明記する
  - id: s0-open-questions
    version: 1
    stageId: S0
    title: 不足情報を洗い出す
